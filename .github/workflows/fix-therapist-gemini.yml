name: Fix therapist Gemini models

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch therapist model fallback chain
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server-api.ts')
          s = p.read_text()
          old = """const CANDIDATE_CHAT_MODELS = [
  'gemini-3.5-flash',
  'gemini-3.1-flash-lite',
  'gemini-2.5-flash',
  'gemini-flash-latest'
];"""
          new = """const CANDIDATE_CHAT_MODELS = [
  'gemini-2.5-flash',
  'gemini-flash-latest'
];"""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              s = s.replace("'gemini-3.5-flash',\n", "")
              s = s.replace("'gemini-3.1-flash-lite',\n", "")
          p.write_text(s)
          PY

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server-api.ts
          if git diff --cached --quiet; then
            echo "No therapist model changes needed."
            exit 0
          fi
          git commit -m "fix therapist Gemini model fallback"
          git push
