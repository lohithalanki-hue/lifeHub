name: Repair LifeHub therapist Gemini integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch therapist model configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/server-api.ts')
          s = p.read_text()
          original = s

          # Replace the whole candidate list regardless of its current contents.
          s, n = re.subn(
              r"const CANDIDATE_CHAT_MODELS = \[[\s\S]*?\];",
              """const CANDIDATE_CHAT_MODELS = [
  'gemini-3.6-flash',
  'gemini-3.5-flash-lite',
  'gemini-3.1-flash-lite',
  'gemini-2.5-flash'
];""",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not find therapist model list')

          # Replace retired/invalid hard-coded model IDs elsewhere in this API file.
          s = s.replace("'gemini-3.7-flash'", "'gemini-3.6-flash'")
          s = s.replace("'gemini-3.5-flash'", "'gemini-3.6-flash'")

          # Gemini 3.6 Flash / 3.5 Flash-Lite no longer accept deprecated sampling params.
          s = re.sub(r"^\s*temperature:\s*[^,\n]+,\s*\n", "", s, flags=re.MULTILINE)
          s = re.sub(r"^\s*topP:\s*[^,\n]+,\s*\n", "", s, flags=re.MULTILINE)
          s = re.sub(r"^\s*topK:\s*[^,\n]+,\s*\n", "", s, flags=re.MULTILINE)

          if s == original:
              raise SystemExit('Patch produced no source changes')

          p.write_text(s)
          print(f'Patched therapist backend; model-list replacements: {n}')
          PY

      - name: Validate TypeScript build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server-api.ts
          git commit -m "fix therapist Gemini model integration"
          git push
